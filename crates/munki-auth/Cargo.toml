[package]
name = "munki-auth"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
keyring = { version = "~3.6", default-features = false, features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust", "vendored"] }
oauth2 = { version = "5", default-features = false, features = ["reqwest", "rustls-tls"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["net", "io-util", "rt", "macros", "time"] }
url = "2"
subtle = "2"
