[package]
name = "munki-ai"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
munki-core = { path = "../munki-core" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
